<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b10" />
  <title>person</title>

  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(255,255,255,.055);
      --panel-strong: rgba(255,255,255,.09);
      --text: #f4f5f7;
      --muted: rgba(244,245,247,.52);
      --line: rgba(255,255,255,.12);
      --accent: #c7b8ff;
      --max: 760px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(88,72,140,.18), transparent 38rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(100%, var(--max));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(22px, env(safe-area-inset-top))
               18px
               max(18px, env(safe-area-inset-bottom));
    }

    header {
      padding: 12px 4px 18px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 46px);
      line-height: .98;
      font-weight: 560;
      letter-spacing: -.035em;
    }

    .subhead {
      margin: 10px 0 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 2px 150px;
      scrollbar-width: none;
    }

    #messages::-webkit-scrollbar { display: none; }

    .message {
      margin: 0 0 22px;
      animation: appear .22s ease-out;
    }

    .role {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 7px;
    }

    .bubble {
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.56;
      letter-spacing: -.006em;
    }

    .message.user .bubble {
      color: rgba(244,245,247,.72);
    }

    .message.assistant .bubble {
      font-size: 19px;
      line-height: 1.58;
    }

    .composer-wrap {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, var(--max));
      padding: 36px 18px max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18,19,26,.92);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 34px rgba(0,0,0,.28);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      min-height: 26px;
      max-height: 150px;
      padding: 8px 8px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
    }

    textarea::placeholder { color: rgba(244,245,247,.34); }

    button {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--text);
      color: #0a0b10;
      font-size: 20px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    button:disabled {
      opacity: .28;
      cursor: default;
    }

    .status {
      min-height: 18px;
      margin: 7px 4px 0;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .typing::after {
      content: " ·";
      animation: dots 1s steps(4,end) infinite;
    }

    @keyframes dots {
      0% { content: " ·"; }
      33% { content: " ··"; }
      66% { content: " ···"; }
      100% { content: " ·"; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .app { padding-left: 16px; padding-right: 16px; }
      .composer-wrap { padding-left: 16px; padding-right: 16px; }
      .message.assistant .bubble { font-size: 18px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <p class="eyebrow">a conversation</p>
      <h1>ariel</h1>
      <p class="subhead">You can say anything. This conversation stays on this device unless you clear your browser storage.</p>
    </header>

    <section id="messages" aria-live="polite"></section>
  </main>

  <div class="composer-wrap">
    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="1"
        maxlength="5000"
        autocomplete="off"
        placeholder="say something"
        aria-label="Message"
      ></textarea>
      <button id="send" type="submit" aria-label="Send">↑</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    // CHANGE THIS after you deploy the Worker.
    const API_URL = "https://person-chat.jbechs.workers.dev";

    const STORAGE_KEY = "person-chat-v1";

    const messagesEl = document.querySelector("#messages");
    const composer = document.querySelector("#composer");
    const input = document.querySelector("#input");
    const sendButton = document.querySelector("#send");
    const statusEl = document.querySelector("#status");

    let messages = loadMessages();

    if (messages.length === 0) {
      messages = [{
        role: "assistant",
        content: "Hello. I’m here."
      }];
      saveMessages();
    }

    render();

    function loadMessages() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function render() {
      messagesEl.innerHTML = "";

      for (const message of messages) {
        const article = document.createElement("article");
        article.className = `message ${message.role}`;

        const role = document.createElement("div");
        role.className = "role";
        role.textContent = message.role === "user" ? "you" : "person";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = message.content;

        article.append(role, bubble);
        messagesEl.appendChild(article);
      }

      scrollToBottom();
    }

    function addMessage(role, content) {
      messages.push({ role, content });
      saveMessages();
      render();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        window.scrollTo({
          top: document.documentElement.scrollHeight,
          behavior: "smooth"
        });
      });
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      input.disabled = busy;
      statusEl.textContent = busy ? "person is thinking" : "";
      statusEl.classList.toggle("typing", busy);
    }

    function autoSize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    }

    input.addEventListener("input", autoSize);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    composer.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      autoSize();
      setBusy(true);

      try {
        // Send only the latest part of the conversation to keep cost bounded.
        const recentMessages = messages.slice(-20);

        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: recentMessages })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        addMessage("assistant", data.text);
      } catch (error) {
        console.error(error);
        addMessage(
          "assistant",
          "I lost the connection for a moment. Try saying that again."
        );
      } finally {
        setBusy(false);
        input.focus();
      }
    });
  </script>
</body>
</html>
